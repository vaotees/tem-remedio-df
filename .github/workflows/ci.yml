name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # A versão web vai para o GitHub Pages (workflow do coletor): o PR já confere que ela exporta.
      - name: Exporta a versão web
        working-directory: apps/mobile
        env:
          TEM_REMEDIO_BASE_URL: /tem-remedio-df/app
        run: pnpm exec expo export --platform web --output-dir dist
