name: Coletor diário

# A SES-DF atualiza o painel por volta de 00h16 e de 16h16 (alguns dias, 19h16), horário de Brasília.
# Os agendamentos em hora cheia chegaram a atrasar 8 horas no GitHub (o das 01h00 rodava entre 08h e 09h30).
# Por isso confere de hora em hora, no minuto 47: sem dado novo, o coletor para depois de uma consulta.
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.coletor.outputs.publicar }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: pages
        uses: actions/configure-pages@v6

      # Cópia da CMED, usada se a Anvisa estiver fora do ar.
      - uses: actions/cache/restore@v6
        with:
          path: pipeline/.cache
          key: cmed-${{ github.run_id }}
          restore-keys: cmed-

      - id: coletor
        working-directory: pipeline
        env:
          ANTERIOR_URL: ${{ steps.pages.outputs.base_url }}/meta.json
        run: pnpm coletar --saida saida

      # Só guarda a CMED quando a coleta foi até o fim (a cada dado novo, não a cada hora).
      - if: steps.coletor.outputs.publicar == 'true'
        uses: actions/cache/save@v6
        with:
          path: pipeline/.cache
          key: cmed-${{ github.run_id }}

      - if: steps.coletor.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pipeline/saida

  publicar:
    needs: coletar
    if: needs.coletar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
