name: Coletor diário

# A SES-DF atualiza o painel por volta de 00h16 e de 16h16 (alguns dias, 19h16), horário de Brasília.
# Os agendamentos em hora cheia chegaram a atrasar 8 horas no GitHub (o das 01h00 rodava entre 08h e 09h30).
# Por isso confere de hora em hora, no minuto 47: sem dado novo, o coletor para depois de uma consulta.
#
# O site do GitHub Pages tem os dados (snapshot.json, meta.json) na raiz e a versão web do app em /app.
# O Pages publica o site inteiro de uma vez, então os dois sempre saem juntos:
# - dado novo da SES-DF: coleta, exporta o app e publica;
# - mudança no app na main: pega os dados que já estão publicados, exporta o app e publica (sem coletar).
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "scripts/montar-site.mjs"
      - ".github/workflows/coletor-diario.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.decidir.outputs.publicar }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - id: pages
        uses: actions/configure-pages@v6

      # Cópia da CMED, usada se a Anvisa estiver fora do ar.
      - if: github.event_name != 'push'
        uses: actions/cache/restore@v6
        with:
          path: pipeline/.cache
          key: cmed-${{ github.run_id }}
          restore-keys: cmed-

      - id: coletor
        if: github.event_name != 'push'
        working-directory: pipeline
        env:
          ANTERIOR_URL: ${{ steps.pages.outputs.base_url }}/meta.json
        run: pnpm coletar --saida saida

      # Só guarda a CMED quando a coleta foi até o fim (a cada dado novo, não a cada hora).
      - if: steps.coletor.outputs.publicar == 'true'
        uses: actions/cache/save@v6
        with:
          path: pipeline/.cache
          key: cmed-${{ github.run_id }}

      # Mudança no app: os dados continuam os que já estão no ar.
      - if: github.event_name == 'push'
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p pipeline/saida
          curl -fsS "$BASE/meta.json" -o pipeline/saida/meta.json
          curl -fsS "$BASE/snapshot.json" -o pipeline/saida/snapshot.json

      - id: decidir
        run: echo "publicar=${{ github.event_name == 'push' || steps.coletor.outputs.publicar == 'true' }}" >> "$GITHUB_OUTPUT"

      # Versão web do app, com os endereços a partir de /<repositório>/app.
      - if: steps.decidir.outputs.publicar == 'true'
        working-directory: apps/mobile
        env:
          TEM_REMEDIO_BASE_URL: ${{ steps.pages.outputs.base_path }}/app
        run: pnpm exec expo export --platform web --output-dir dist

      - if: steps.decidir.outputs.publicar == 'true'
        run: node scripts/montar-site.mjs --dados pipeline/saida --web apps/mobile/dist --saida _site

      - if: steps.decidir.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publicar:
    needs: coletar
    if: needs.coletar.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
